name: CI / Build Check

on:
  # push/pull_request 자동 트리거 비활성화 — 운영 정지 요청 (2026-07-13).
  # 회귀 detection 이 필요할 때는 workflow_dispatch 로 수동 실행.
  # 복원: 아래 push/pull_request 블록 주석 해제.
  # push:
  #   branches: [ "main" ]
  # pull_request:
  #   branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Unit tests
      run: npm test

    - name: Build Astro project
      run: npm run build
