name: 📊 Weekly Cycle (Mon/Wed/Fri)

# 시니어 팀 풀 패널 /weekly 사이클. Growth bet 1 + Defensive 1.
# 월·수·금 21 KST = 12 UTC.
#
# ⚠️ 활성화 전 필수 작업:
# 1. GitHub Settings → Secrets and variables → Actions 에서 ANTHROPIC_API_KEY 등록.
# 2. GEMINI_API_KEY (improvement-loop 폴백) 등록.
# 3. 아래 Claude 호출 옵션 1개 선택.
# 4. 첫 실행은 workflow_dispatch 로 수동 검증.
#
# 주의: weekly 는 LLM 비용이 가장 높음 ($5-15/회). 호출 빈도 잘 검토.

on:
  # cron 비활성화 — 로컬 Claude Code 에서 `/weekly` 수동 또는 `/loop` 로 대체.
  # weekly 패턴(월·수·금 21 KST)은 /loop 의 상대 간격으로 정확히 맞추기 어려워
  # 사용자가 직접 호출하거나 workflow_dispatch 로 실행.
  # schedule:
  #   # Mon/Wed/Fri 12 UTC = 월/수/금 21 KST
  #   - cron: '0 12 * * 1,3,5'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: weekly-cycle
  cancel-in-progress: false

jobs:
  run-weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # weekly 는 60-90분 권장 budget
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Install deps
        run: npm ci --no-audit --no-fund

      - name: 📊 Run /weekly (Claude Code Action v1)
        # 공식 anthropics/claude-code-action@v1.
        # weekly 의 1단계는 npm run loop 실행 → GEMINI_API_KEY 도 env 로 전달.
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt_file: .github/workflows/prompts/weekly.txt
          claude_args: '--dangerously-skip-permissions'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 💾 Commit loop artifacts
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/improvement-loop/state/history/ 2>/dev/null || true
          if git diff --cached --quiet 2>/dev/null; then
            echo "ℹ️ No new loop artifacts to commit."
          else
            git commit -m "chore(loop): weekly cycle artifacts" || true
            git push || true
          fi

      - name: 📨 Notify Slack (선택, on failure)
        if: failure() && env.SLACK_WEBHOOK != ''
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          curl -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\"⚠️ /weekly 사이클 실패\\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$SLACK_WEBHOOK"
